<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha técnica · Feisma 2026 · SMDEI</title>
<meta name="description" content="Ficha técnica da Feisma 2026: expositores, público, resultados de negócio e perfil, em uma página.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--navy:#3D1A5B;--purple:#8A2BAE;--green:#58B947;--gold:#F7A81E;--magenta:#E6188D;--sky:#1F9BD4;--orange:#F7901E;--bg:#F7F3FB;--ink:#241433;--muted:#6E5C82;--line:#EAE2F2}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;background:#E9E3F0;color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 1px 0 var(--line);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 14px}
.bar a,.bar button{font:600 13px Inter,sans-serif;border-radius:999px;padding:9px 16px;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--purple)}
.bar .pri{background:var(--orange);border-color:var(--orange);color:#fff}
.bar .msg{font-size:12px;color:var(--muted)}
.sheet{width:210mm;height:296mm;margin:18px auto;background:#fff;box-shadow:0 12px 40px rgba(61,26,91,.15);padding:12mm 14mm 9mm;position:relative;overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--navy);padding-bottom:9px}
.top img{height:34px}
.top .t{text-align:right}.top .t b{font-family:Sora,sans-serif;font-size:19px;color:var(--navy);display:block;line-height:1.05}.top .t span{font-size:11px;color:var(--muted)}
.id{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:16px 0 14px}
.id h1{font-family:Sora,sans-serif;font-size:38px;color:var(--navy);margin:0;line-height:1;letter-spacing:-.02em}.id h1 em{font-style:normal;color:var(--magenta)}
.id .ey{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);font-weight:700;margin-bottom:4px}
.id dl{margin:0;display:grid;grid-template-columns:auto auto;gap:3px 12px;font-size:11px}.id dt{color:var(--muted)}.id dd{margin:0;font-weight:600}
.tot{background:linear-gradient(120deg,#3D1A5B,#8A2BAE 70%,#E6188D);color:#fff;border-radius:14px;padding:24px 26px;display:grid;grid-template-columns:auto 1fr;gap:6px 30px;align-items:center}
.tot .tk{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.tot .v{font-family:Sora,sans-serif;font-size:50px;font-weight:800;letter-spacing:-.03em;line-height:1.05;white-space:nowrap}
.tot .d{font-size:10.5px;opacity:.85;margin-top:2px}
.tot ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.tot li{display:flex;align-items:baseline;gap:10px;border-left:3px solid var(--gold);padding-left:10px;font-size:12px}
.tot li b{font-family:Sora,sans-serif;font-size:17px;min-width:96px;white-space:nowrap}
h2{font-family:Sora,sans-serif;font-size:12.5px;color:var(--navy);margin:24px 0 10px;text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:8px}
h2 i{display:inline-block;width:18px;height:3px;border-radius:2px;background:var(--magenta)}
.badge{font-size:8.5px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:999px;background:var(--orange);color:#fff}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k{background:var(--bg);border-radius:12px;padding:15px 16px 14px;border-top:4px solid var(--purple)}
.k.o{border-top-color:var(--orange)}.k.v{border-top-color:var(--green)}.k.s{border-top-color:var(--sky)}
.k .n1{font-family:Sora,sans-serif;font-weight:800;font-size:30px;color:var(--navy);line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.k .l{font-size:12px;font-weight:600;margin-top:3px;line-height:1.25}
.k .n{font-size:9.5px;color:var(--muted);margin-top:2px;line-height:1.3}
.k.big{grid-column:span 1}.k.big .n1{font-size:34px}
.sp{flex:1}
.foot{border-top:1px solid var(--line);padding-top:8px;display:grid;grid-template-columns:1.6fr 1fr;gap:14px;font-size:8.3px;color:var(--muted);line-height:1.45}
.foot b{color:var(--navy)}.sig{text-align:right}.sig b{font-family:Sora,sans-serif;font-size:10px;display:block}
.loading{text-align:center;padding:120px 0;color:var(--muted)}
@page{size:A4;margin:0}
@media print{body{background:#fff}.bar{display:none}.sheet{margin:0;box-shadow:none;width:210mm;height:297mm}}
</style>
</head>
<body>
<div class="bar">
 <a href="/">← Feisma em Números</a>
 <button class="pri" id="bt-pdf">Baixar ficha técnica (PDF)</button>
 <button onclick="window.print()">Imprimir</button>
 <span class="msg" id="msg"></span>
</div>
<div id="wrap"><div class="sheet"><div class="loading">Carregando os dados…</div></div></div>
<script>
const fmt=(v,c=0)=>Number(v).toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c});
const fi=i=>i?`${i.prefixo||''}${fmt(i.valor,i.casas)}${i.sufixo||''}`:'—';
const mi=v=>'R$ '+fmt(v,2)+' mi';
const k=(v,l,n='',t='')=>`<div class="k ${t}"><div class="n1">${v}</div><div class="l">${l}</div>${n?`<div class="n">${n}</div>`:''}</div>`;
let D;
function render(){
 const M=D.meta,I=D.indicadores,V=D.visitacao,N=Number(M.pesquisa_n_empresas);
 const R=V.filter(r=>r.situacao!=='estimado'), estd=V.filter(r=>r.situacao==='estimado').reduce((a,r)=>a+r.entradas,0), ent=R.reduce((a,r)=>a+r.entradas,0), pico=R.reduce((a,r)=>r.entradas>a.entradas?r:a,R[0]);
 const prev=M.visitacao_status==='prévia', AJ=Number(M.ajuste_expositores||0), est=Math.round((ent+estd)*(1+AJ));
 const inv=I.investimento.valor/1000, ven=I.vendas.valor, neg=I.negocios.valor, pat=Number(M.patrocinio_mi||0);
 const it=[pat&&[pat,'em patrocínios'],[inv,'investidos pelos expositores'],[ven,'vendidos durante a feira'],[neg,'em negócios a fechar em até 6 meses']].filter(Boolean);
 const pv=I.voltam?Math.round(100*I.voltam.valor/N):null;
 document.getElementById('wrap').innerHTML=`<div class="sheet" id="sheet">
 <div class="top"><img src="https://netqjehamlydexyasgfk.supabase.co/storage/v1/object/public/midia/prefeitura_logo/1782071804915_marca-prefeitura-santa-maria-2025-2028-horizontal-policromatica-uso-sobre-fundo-claro-3-.png" alt="Prefeitura de Santa Maria" crossorigin="anonymous">
  <div class="t"><b>Ficha técnica</b><span>Feisma em Números · atualizada em ${M.atualizado_em}</span></div></div>
 <div class="id"><div><div class="ey">${M.edicao}</div><h1>Feisma <em>2026</em></h1></div>
  <dl><dt>Período</dt><dd>${M.periodo} · ${V.length} dias</dd><dt>Local</dt><dd>Santa Maria · RS</dd><dt>Realização</dt><dd>CACISM · Prefeitura de Santa Maria</dd></dl></div>

 <div class="tot"><div><div class="tk">Dinheiro movimentado pela feira</div><div class="v">${mi(inv+ven+neg+pat)}</div><div class="d">Valores informados por ${N} expositores na pesquisa oficial</div></div>
  <ul>${it.map(x=>`<li><b>${mi(x[0])}</b>${x[1]}</li>`).join('')}</ul></div>

 <h2><i></i>A feira</h2>
 <div class="g">
  ${k(fi(I.estandes),'estandes ocupados',I.estandes?.nota||'por 235 expositores')}
  ${k(fi(I.segmentos),'segmentos econômicos')}
  ${k(fi(I.regiao_central),'das empresas são da Região Central',I.regiao_central?.nota||'')}
 </div>

 <h2><i></i>O público ${prev?'<span class="badge">Prévia · '+M.visitacao_corte+'</span>':''}</h2>
 <div class="g">
  ${AJ?k(fmt(est),'público estimado',(estd?fmt(ent)+' registradas + '+fmt(estd)+' estimadas (último dia) + ':'entradas registradas + ')+fmt(AJ*100)+'% de expositores','o big'):''}
  ${k(fmt(ent),'entradas registradas',estd?'até '+R[R.length-1].dia:prev?'até '+M.visitacao_corte:'total do evento','o')}
  ${k(fmt(pico.entradas),'maior dia registrado',pico.dia+' ('+pico.dia_semana.split(' ·')[0]+')','o')}
 </div>

 <h2><i></i>Os resultados para as empresas</h2>
 <div class="g">
  ${k(fi(I.retorno),'em negócios para cada R$ 1 investido','vendas + negócios ÷ investimento','v')}
  ${k(fi(I.leads),'novos contatos de clientes','leads qualificados','v')}
  ${k(fmt(I.contratacoes.valor),'contratações locais',I.contratacoes?.nota||'','v')}
 </div>

 <h2><i></i>A avaliação dos expositores</h2>
 <div class="g">
  ${k(fi(I.nota_geral),'nota geral da feira','escala de 1 a 5','s')}
  ${pv!==null?k(pv+'%','pretendem voltar na próxima edição',fmt(I.voltam.valor)+' de '+N+' empresas','s'):''}
  ${k(fi(I.cobrir),'esperam cobrir o investimento',I.cobrir?.nota||'','s')}
 </div>

 <div class="sp"></div>
 <div class="foot"><div><b>Fontes.</b> Expositores: organização da feira. Público: controle de acesso (consulta de ${M.visitacao_corte}); entradas são registros diários, não pessoas únicas; o público estimado acrescenta ${fmt(AJ*100)}% pela circulação de expositores. Resultados e avaliação: pesquisa com expositores durante a feira (${M.pesquisa_n_respostas} entrevistas, ${N} empresas), valores por faixa somados pelo ponto médio, margem de erro de ±${M.margem_erro||'8'} p.p. Detalhes: feisma-em-numeros.vercel.app</div>
  <div class="sig"><b>Secretaria de Desenvolvimento Econômico e Inovação</b>Prefeitura Municipal de Santa Maria · RS</div></div>
 </div>`;
 fitMobile();
}
function fitMobile(){const s=document.getElementById('sheet');if(!s)return;const w=s.offsetWidth,vw=document.documentElement.clientWidth;if(vw<w+20){const z=(vw-16)/w;s.style.transform=`scale(${z})`;s.style.transformOrigin='top left';s.style.marginLeft='8px';document.getElementById('wrap').style.height=(s.offsetHeight*z+30)+'px'}else{s.style.transform='';document.getElementById('wrap').style.height=''}}
addEventListener('resize',fitMobile);
document.getElementById('bt-pdf').onclick=async()=>{
 const s=document.getElementById('sheet');if(!s||!window.html2pdf){window.print();return}
 const m=document.getElementById('msg');m.textContent='Gerando PDF…';
 const t=s.style.transform,m0=s.style.margin,ml=s.style.marginLeft,b0=s.style.boxShadow;s.style.transform='';s.style.margin='0';s.style.boxShadow='none';
 try{await html2pdf().set({margin:0,filename:`Ficha_Tecnica_Feisma_2026_${(D.meta.atualizado_em||'').replace(/\//g,'-')}.pdf`,image:{type:'jpeg',quality:.96},html2canvas:{scale:2.2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css']}}).from(s).save();m.textContent=''}
 catch(e){m.textContent='Não foi possível gerar o arquivo; use Imprimir → Salvar como PDF.'}
 s.style.transform=t;s.style.margin=m0;s.style.marginLeft=ml;s.style.boxShadow=b0;fitMobile();
};
fetch('/api/dados').then(r=>{if(!r.ok)throw r;return r.json()}).then(d=>{D=d;render()}).catch(()=>{document.getElementById('wrap').innerHTML='<div class="sheet"><div class="loading">Não foi possível carregar os dados agora.</div></div>'});
</script>
</body>
</html>
