<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha técnica · Feisma 2026 · SMDEI</title>
<meta name="description" content="Ficha técnica da Feisma 2026: expositores, público, resultados de negócio e perfil, em uma página.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--navy:#3D1A5B;--purple:#8A2BAE;--soft:#C9A3DE;--green:#58B947;--gold:#F7A81E;--magenta:#E6188D;--sky:#1F9BD4;--orange:#F7901E;--bg:#F7F3FB;--ink:#241433;--muted:#6E5C82;--line:#EAE2F2}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;background:#E9E3F0;color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 1px 0 var(--line);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 14px}
.bar a,.bar button{font:600 13px Inter,sans-serif;border-radius:999px;padding:9px 16px;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--purple)}
.bar .pri{background:var(--orange);border-color:var(--orange);color:#fff}
.bar .msg{font-size:12px;color:var(--muted)}
.sheet{width:210mm;height:296mm;margin:18px auto;background:#fff;box-shadow:0 12px 40px rgba(61,26,91,.15);padding:9mm 11mm 7mm;position:relative;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--navy);padding-bottom:7px}
.top img{height:30px}
.top .t{text-align:right}
.top .t b{font-family:Sora,sans-serif;font-size:17px;color:var(--navy);display:block;line-height:1.05}
.top .t span{font-size:10.5px;color:var(--muted)}
.hero{margin:7px 0 6px;background:linear-gradient(125deg,#2A1140,#3D1A5B 50%,#5B2785);color:#fff;border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:1.3fr 1fr;gap:12px;align-items:center}
.hero .ey{font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-weight:700}
.hero h1{font-family:Sora,sans-serif;font-size:24px;margin:3px 0 2px;line-height:1.05}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin:0;font-size:10.5px;opacity:.85}
.hero dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:10.5px}
.hero dt{opacity:.7}.hero dd{margin:0;font-weight:600}
.badge{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--orange);color:#fff;vertical-align:2px}
h2{font-family:Sora,sans-serif;font-size:11.5px;color:var(--navy);margin:0 0 5px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
h2 i{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--magenta)}
.row{display:grid;gap:7px;margin-bottom:6px}
.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}.r21{grid-template-columns:1.25fr 1fr}
.box{border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.tot{background:linear-gradient(120deg,#3D1A5B,#8A2BAE 70%,#E6188D);color:#fff;border-radius:8px;padding:6px 9px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tot .t{font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}.tot .tv{font-family:Sora,sans-serif;font-weight:800;font-size:21px;line-height:1.05;white-space:nowrap}
.tot .tc{font-size:7.8px;opacity:.9;line-height:1.3;text-align:right}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kp.k3{grid-template-columns:repeat(3,1fr)}
.k{background:var(--bg);border-radius:8px;padding:5px 7px;border-top:3px solid var(--purple)}
.k.g{border-top-color:var(--green)}.k.o{border-top-color:var(--orange)}.k.s{border-top-color:var(--sky)}
.k .v{font-family:Sora,sans-serif;font-weight:800;font-size:14.5px;color:var(--navy);line-height:1.1;white-space:nowrap}
.k .l{font-size:9px;color:var(--ink);font-weight:600;line-height:1.2;margin-top:1px}
.k .n{font-size:8px;color:var(--muted);line-height:1.2}
.hb{display:grid;grid-template-columns:auto 1fr auto;gap:2px 6px;align-items:center;font-size:9.5px}
.hb .lb{color:#4A3563;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.hb .tr{height:8px;border-radius:3px;background:var(--purple)}
.hb .vl{font-weight:700;font-size:9.5px}
.days{display:flex;align-items:flex-end;gap:5px;height:104px;margin-top:4px;border-bottom:1px solid var(--muted);padding:0 2px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.day .cap{position:absolute;bottom:0;width:100%;border:1px dashed #CFC6D9;border-bottom:0;border-radius:4px 4px 0 0}
.day .b{width:62%;background:var(--purple);border-radius:3px 3px 0 0;position:relative}
.day .b.p{background:var(--soft)}
.day .x{width:62%;background:var(--gold);border-radius:3px 3px 0 0}.day .x+.b{border-radius:0}
.day .vv{font-size:8px;font-weight:700;margin-bottom:2px;position:relative}
.dl{display:flex;gap:5px;padding:0 2px}.dl span{flex:1;text-align:center;font-size:7.6px;color:var(--muted);line-height:1.15}
.stk{display:flex;height:13px;border-radius:4px;overflow:hidden;margin:3px 0 3px}
.stk span{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:3px 9px;font-size:8.5px;color:var(--muted)}
.lg i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:3px;vertical-align:0}
.note{font-size:9.5px;line-height:1.45;color:var(--ink);background:#FFF4E8;border-left:3px solid var(--orange);border-radius:6px;padding:6px 9px}
.txt{font-size:9.5px;line-height:1.45;color:var(--ink);margin:0}
.foot{margin-top:6px;border-top:1px solid var(--line);padding-top:6px;display:grid;grid-template-columns:1.6fr 1fr;gap:12px;font-size:7.8px;color:var(--muted);line-height:1.4}
.foot b{color:var(--navy)}
.sig{text-align:right}.sig b{font-family:Sora,sans-serif;font-size:9.5px;display:block}
.loading{text-align:center;padding:120px 0;color:var(--muted)}
@media (max-width:820px){.sheet{transform-origin:top left;margin:12px 0}}
@page{size:A4;margin:0}
@media print{body{background:#fff}.bar{display:none}.sheet{margin:0;box-shadow:none;width:210mm;height:297mm}}
</style>
</head>
<body>
<div class="bar">
 <a href="/">← Feisma em Números</a>
 <button class="pri" id="bt-pdf">Baixar ficha técnica (PDF)</button>
 <button onclick="window.print()">Imprimir</button>
 <span class="msg" id="msg"></span>
</div>
<div id="wrap"><div class="sheet"><div class="loading">Carregando os dados…</div></div></div>
<script>
const fmt=(v,c=0)=>Number(v).toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c});
const fi=i=>i?`${i.prefixo||''}${fmt(i.valor,i.casas)}${i.sufixo||''}`:'—';
const C=['#8A2BAE','#C9A3DE','#58B947','#F7A81E','#F7901E','#CFC6D9','#1F9BD4','#E6188D'];
const k=(v,l,n='',t='')=>`<div class="k ${t}"><div class="v">${v}</div><div class="l">${l}</div>${n?`<div class="n">${n}</div>`:''}</div>`;
function hb(rows,{max,color='#8A2BAE',pct=null,n=6}={}){rows=rows.slice(0,n);max=max||Math.max(...rows.map(r=>r.valor));
 return `<div class="hb">${rows.map((r,i)=>`<div class="lb" title="${r.rotulo}">${r.rotulo}</div><div><div class="tr" style="width:${Math.max(2,100*r.valor/max)}%;background:${typeof color==='function'?color(r,i):color}"></div></div><div class="vl">${fmt(r.valor)}${pct?` <span style="color:#6E5C82;font-weight:500">${fmt(100*r.valor/pct)}%</span>`:''}</div>`).join('')}</div>`}
function stk(rows,cols){const t=rows.reduce((a,r)=>a+r.valor,0);return `<div class="stk">${rows.map((r,i)=>`<span style="width:${100*r.valor/t}%;background:${cols[i]}"></span>`).join('')}</div><div class="lg">${rows.map((r,i)=>`<span><i style="background:${cols[i]}"></i>${r.rotulo} · ${fmt(100*r.valor/t)}%</span>`).join('')}</div>`}
let D;
function render(){
 const M=D.meta,I=D.indicadores,S=g=>D.series[g]||[],V=D.visitacao;
 const ent=V.reduce((a,r)=>a+r.entradas,0), cap=V.reduce((a,r)=>a+(r.capacidade||0),0), pico=V.reduce((a,r)=>r.entradas>a.entradas?r:a,V[0]);
 const real=V.filter(r=>r.situacao==='realizado'), fds=V.slice(0,3).reduce((a,r)=>a+r.entradas,0);
 const prev=M.visitacao_status==='prévia';
 const mx=Math.max(...V.map(r=>Math.max(r.entradas*(1+Number(M.ajuste_expositores||0)),r.capacidade||0)));
 const N=Number(M.pesquisa_n_empresas);
 const AJ=Number(M.ajuste_expositores||0), est=Math.round(ent*(1+AJ));
 const conf=(I.ingressos_pagos?.valor||0)+(I.gratuitos?.valor||0);
 document.getElementById('wrap').innerHTML=`<div class="sheet" id="sheet">
 <div class="top"><img src="https://netqjehamlydexyasgfk.supabase.co/storage/v1/object/public/midia/prefeitura_logo/1782071804915_marca-prefeitura-santa-maria-2025-2028-horizontal-policromatica-uso-sobre-fundo-claro-3-.png" alt="Prefeitura de Santa Maria" crossorigin="anonymous">
  <div class="t"><b>Ficha técnica</b><span>Feisma em Números · atualizada em ${M.atualizado_em}</span></div></div>
 <div class="hero"><div><div class="ey">${M.edicao}</div><h1>Feisma <em>2026</em></h1><p>Feira multissetorial de Santa Maria, RS. Indústria, comércio, serviços, setor imobiliário, educação e poder público em um só lugar.</p></div>
  <dl><dt>Período</dt><dd>${M.periodo}</dd><dt>Duração</dt><dd>${V.length} dias</dd><dt>Local</dt><dd>Santa Maria · RS</dd><dt>Realização</dt><dd>CACISM · Prefeitura de Santa Maria</dd><dt>Dados</dt><dd>SMDEI · Prefeitura de Santa Maria</dd></dl></div>

 <div class="row"><div class="box"><h2><i></i>A feira em números</h2><div class="kp">
  ${k(fi(I.expositores),'expositores',I.expositores?.nota||'','')}
  ${k(fi(I.estandes),'estandes ocupados','','')}
  ${k(fi(I.modulos),'módulos ocupados','','')}
  ${k(fi(I.segmentos),'segmentos','','')}
  ${AJ?k(fmt(est),'público estimado',fmt(ent)+' entradas + '+fmt(AJ*100)+'% expositores'+(prev?' · prévia':''),'o'):k(fmt(ent),'entradas registradas',prev?'prévia até '+M.visitacao_corte:'total do evento','o')}
  ${k(fmt(pico.entradas),'pico diário',pico.dia+' ('+pico.dia_semana+')','o')}
  ${k(fmt(conf),'ingressos confirmados',fmt(I.ingressos_pagos?.valor||0)+' pagos + '+fmt(I.gratuitos?.valor||0)+' gratuitos','o')}
  ${k(fi(I.cracha_expositores),'crachás de expositores','representantes','o')}
 </div></div></div>

 <div class="row r21">
  <div class="box"><h2><i></i>${AJ?'Público estimado por dia':'Entradas por dia'} ${prev?'<span class="badge">Prévia</span>':''}</h2>
   <div class="days">${V.map(r=>{const fut=r.situacao==='a realizar';return `<div class="day"><div class="cap" style="height:${100*(r.capacidade||0)/mx}%"></div><div class="vv">${fut?'':(r.entradas*(1+AJ)>=1000?fmt(r.entradas*(1+AJ)/1000,1)+'k':fmt(r.entradas*(1+AJ)))}</div>${AJ&&!fut?`<div class="x" style="height:${100*r.entradas*AJ/mx}%"></div>`:''}<div class="b ${r.situacao==='parcial'?'p':''}" style="height:${fut?0:100*r.entradas/mx}%"></div></div>`}).join('')}</div>
   <div class="dl">${V.map(r=>`<span>${r.dia}<br>${r.dia_semana.split(' ·')[0]}</span>`).join('')}</div>
   <div class="lg" style="margin-top:4px"><span><i style="background:#8A2BAE"></i>entradas registradas</span>${AJ?`<span><i style="background:#F7A81E"></i>+${fmt(AJ*100)}% expositores (estimativa)</span>`:''}<span><i style="background:#C9A3DE"></i>dia parcial</span><span><i style="background:#fff;border:1px dashed #CFC6D9"></i>capacidade</span><span>Ocupação: ${fmt(100*real.reduce((a,r)=>a+r.entradas,0)/Math.max(1,real.reduce((a,r)=>a+(r.capacidade||0),0)))}% nos dias encerrados · feriadão: ${fmt(100*fds/Math.max(ent,1))}% do fluxo</span></div>
  </div>
  <div class="box"><h2><i></i>Expositores por origem</h2>${hb(S('ddd'),{color:(r,i)=>C[i]})}
   <h2 style="margin-top:8px"><i></i>Estandes por pavilhão</h2>${hb(S('pavilhoes'),{color:'#3D1A5B'})}</div>
 </div>

 <div class="row r2">
  <div class="box"><h2><i></i>Principais segmentos</h2>${hb(S('segmentos').filter(r=>r.rotulo!=='A confirmar'),{n:8,color:r=>r.destaque?'#F7901E':'#8A2BAE'})}</div>
  <div class="box"><h2><i></i>Resultados de negócio · pesquisa com ${N} expositores</h2>
   ${(()=>{const inv=I.investimento.valor/1000,ven=I.vendas.valor,neg=I.negocios.valor,pat=Number(M.patrocinio_mi||0);const m=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' mi';
    return `<div class="tot"><div><div class="t">Dinheiro movimentado pela feira</div><div class="tv">${m(inv+ven+neg+pat)}</div></div><div class="tc">${pat?m(pat)+' em patrocínios<br>':''}${m(inv)} investidos pelos expositores<br>${m(ven)} vendidos durante a feira<br>${m(neg)} em negócios a fechar em até 6 meses</div></div>`})()}
   <div class="kp k3">
   ${k(fi(I.vendas),'vendas na feira',I.vendas?.nota||'','g')}
   ${k(fi(I.negocios),'negócios encaminhados','3 a 6 meses','g')}
   ${k(fi(I.retorno),'por real investido','vendas + negócios','g')}
   ${k(fi(I.leads),'contatos qualificados','','s')}
   ${k(fi(I.contratacoes),'contratações locais',I.contratacoes?.nota||'','s')}
   ${k(fi(I.cobrir),'esperam cobrir o investimento',I.cobrir?.nota||'','s')}
  </div></div>
 </div>

 <div class="row r3">
  <div class="box"><h2><i></i>Avaliação</h2><div class="kp" style="grid-template-columns:1fr 1fr">
   ${k(fi(I.nota_geral),'avaliação geral','escala 1 a 5','')}
   ${k(fi(I.nps),'NPS de expositores',I.nps?.nota||'','o')}
   ${k(fi(I.nota_volume),'volume de público','','')}
   ${k(fi(I.nota_qualidade),'qualidade do público','','o')}</div></div>
  <div class="box"><h2><i></i>Pretendem voltar</h2>${stk(S('retorno_prox'),['#58B947','#F7A81E','#D8434B'])}
   <h2 style="margin-top:8px"><i></i>Porte (amostra)</h2>${hb(S('porte'),{color:'#1F9BD4',pct:N})}</div>
  <div class="box"><h2><i></i>Prioridades de melhoria</h2>${hb(S('melhorias'),{n:5,color:'#1F9BD4'})}
   <h2 style="margin-top:8px"><i></i>Manter</h2>${hb(S('manter'),{n:3,color:'#58B947'})}</div>
 </div>

 <div class="row"><div class="note">${(D.textos.cap_conc&&D.textos.cap_conc.corpo)||''} ${(D.textos.lead_satisfacao&&D.textos.lead_satisfacao.corpo)||''}</div></div>

 <div class="foot"><div><b>Fontes e método.</b> Expositores: planilha de estandes da organização. Público: painel de ingressos e controle de acesso (consulta de ${M.visitacao_corte}); entradas são registros diários e incluem público e equipe, não pessoas únicas; o público estimado acrescenta 25% referente à circulação de expositores, conforme orientação da organização. Resultados: pesquisa com expositores durante a feira (${M.pesquisa_n_respostas} entrevistas, ${N} empresas); valores por faixa somados pelo ponto médio; margem de erro aproximada de ±${M.margem_erro||'8'} p.p. Versão completa: feisma-em-numeros.vercel.app</div>
  <div class="sig"><b>Secretaria de Desenvolvimento Econômico e Inovação</b>Prefeitura Municipal de Santa Maria · RS<br>Realização da Feisma: CACISM · Prefeitura de Santa Maria</div></div>
 </div>`;
 fitMobile();
}
function fitMobile(){const s=document.getElementById('sheet');if(!s)return;const w=s.offsetWidth,vw=document.documentElement.clientWidth;if(vw<w+20){const z=(vw-16)/w;s.style.transform=`scale(${z})`;s.style.transformOrigin='top left';s.style.marginLeft='8px';document.getElementById('wrap').style.height=(s.offsetHeight*z+30)+'px'}else{s.style.transform='';document.getElementById('wrap').style.height=''}}
addEventListener('resize',fitMobile);
document.getElementById('bt-pdf').onclick=async()=>{
 const s=document.getElementById('sheet');if(!s||!window.html2pdf){window.print();return}
 const m=document.getElementById('msg');m.textContent='Gerando PDF…';
 const t=s.style.transform,m0=s.style.margin,ml=s.style.marginLeft,b0=s.style.boxShadow;s.style.transform='';s.style.margin='0';s.style.boxShadow='none';
 try{await html2pdf().set({margin:0,filename:`Ficha_Tecnica_Feisma_2026_${(D.meta.atualizado_em||'').replace(/\//g,'-')}.pdf`,image:{type:'jpeg',quality:.96},html2canvas:{scale:2.2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css']}}).from(s).save();m.textContent=''}
 catch(e){m.textContent='Não foi possível gerar o arquivo; use Imprimir → Salvar como PDF.'}
 s.style.transform=t;s.style.margin=m0;s.style.marginLeft=ml;s.style.boxShadow=b0;fitMobile();
};
fetch('/api/dados').then(r=>{if(!r.ok)throw r;return r.json()}).then(d=>{D=d;render()}).catch(()=>{document.getElementById('wrap').innerHTML='<div class="sheet"><div class="loading">Não foi possível carregar os dados agora.</div></div>'});
</script>
</body>
</html>
